# ------------------------------------------------------------
# sqrd-page-cache — optional brotli pre-compressed serving
#
# ONLY include this file when ngx_brotli is compiled into nginx.
# Verify with:  nginx -V 2>&1 | grep brotli
# If the module is missing, nginx will REFUSE TO START with these directives.
#
# Include inside your server { } block, AFTER sqrd-page-cache.conf:
#
#   include /path/to/.../sqrd-page-cache/nginx/sqrd-page-cache.conf;
#   include /path/to/.../sqrd-page-cache/nginx/brotli-static.conf;
#
# Reload: nginx -t && systemctl reload nginx
# ------------------------------------------------------------

# Serve pre-compressed .br siblings. nginx checks brotli_static BEFORE
# gzip_static, so a client that accepts both encodings gets the .br sibling
# (brotli compresses text better than gzip) and falls back to .gz, then to the
# plain file. There is no brotli_vary directive — gzip_vary (set in the main
# include) emits the Vary: Accept-Encoding header that covers both.
brotli_static on;

# brotli_types governs RUNTIME brotli compression (requires `brotli on`), not
# brotli_static — brotli_static matches by the .br extension and the inner
# file's MIME map. These types are listed for forward-compatibility: if you
# also enable runtime brotli elsewhere in the vhost, the cache's text types are
# already covered.
brotli_types text/html text/markdown text/plain text/css text/xml
             application/javascript application/json application/xml+rss;
