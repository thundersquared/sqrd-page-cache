# ------------------------------------------------------------
# sqrd-page-cache — vhost-scoped nginx include
#
# Place this inside your WordPress server { } block, ABOVE the
# `location /` block. No http { } level changes are required.
#
# After including this file, update your location / block to:
#
#   location / {
#       try_files $sqrd_cache_file $uri $uri/ /index.php?$args;
#   }
#
# See nginx/example-server.conf for a full annotated example.
# ------------------------------------------------------------


# ── MIME types ────────────────────────────────────────────────────────────────
# NOTE: a `types { ... }` block at server scope would REPLACE the inherited
# http-level mime.types entirely — every css/js/woff/png/etc. would then fall
# back to `application/octet-stream`, which modern browsers refuse to execute
# under strict MIME-type checking (wp-admin breaks first, but every theme and
# plugin asset follows). The MIME map for .md is scoped to the cache HIT
# location at the bottom of this file instead, so the rest of the vhost keeps
# using the system mime.types unmodified.


# ── Accept header → cache variant ────────────────────────────────────────────
# Simple substring match — no q-value parsing.
# MUST mirror sqrd\Cache\Negotiation::ext_for_accept() in PHP exactly.
# If you change one, change both.
set $sqrd_cache_ext "html";
if ($http_accept ~* "text/markdown") {
    set $sqrd_cache_ext "md";
}


# ── URI normalisation ─────────────────────────────────────────────────────────
# Force a trailing slash so /about and /about/ resolve to the same cache file.
# PHP's Paths::normalize_uri() applies the identical rule.
set $sqrd_uri $uri;
if ($sqrd_uri !~ "/$") {
    set $sqrd_uri "${uri}/";
}


# ── Cache file path ───────────────────────────────────────────────────────────
# Build the candidate path for try_files.  When any bypass condition below
# matches, $sqrd_cache_file is redirected to a sentinel path that doesn't
# exist on disk — try_files then falls through harmlessly to PHP.
set $sqrd_cache_file "/wp-content/cache/sqrd-page-cache/$host${sqrd_uri}index.$sqrd_cache_ext";


# ── Bypass conditions ─────────────────────────────────────────────────────────
# Non-GET / non-HEAD methods must never hit the static cache.
if ($request_method !~ ^(GET|HEAD)$) {
    set $sqrd_cache_file "/sqrd-bypass";
}

# Any query string bypasses the cache — EXCEPT when every parameter is a known
# analytics/ad-click tracker (Google Analytics, UTM, Facebook, Microsoft, etc.).
# Tracker-only URLs still resolve to the same cache file because Paths::file_for
# in PHP strips query strings entirely from the cache key.
#
# Pattern list mirrors Output::TRACKING_PATTERNS in PHP — keep both in sync.
# To extend in PHP only, hook the `sqrd_page_cache/tracking_params` filter. To extend
# here, add the new param name to both alternation groups below (it has to appear
# in both: the standalone case and the "joined by &" case).
set $sqrd_has_real_args 0;
if ($args) {
    set $sqrd_has_real_args 1;
}
if ($args ~ "^(_ga|_ga_[A-Z0-9]+|_gl|utm_[a-z_]+|fbclid|gclid|msclkid|mc_cid|mc_eid|yclid|dclid)=[^&]*(&(_ga|_ga_[A-Z0-9]+|_gl|utm_[a-z_]+|fbclid|gclid|msclkid|mc_cid|mc_eid|yclid|dclid)=[^&]*)*$") {
    set $sqrd_has_real_args 0;
}
if ($sqrd_has_real_args) {
    set $sqrd_cache_file "/sqrd-bypass";
}

# Logged-in users, commenters, and password-protected posts bypass the cache.
# Extend this regex with app-specific cookies as needed:
#   woocommerce_items_in_cart, edd_items_in_cart, etc.
if ($http_cookie ~* "(wordpress_logged_in_|wp-postpass_|comment_author_)") {
    set $sqrd_cache_file "/sqrd-bypass";
}


# ── Response headers ──────────────────────────────────────────────────────────
# Vary: Accept must appear on every response — both cache HITs served by nginx
# and cache MISSes served by PHP — so downstream caches (CDNs, browser) store
# and replay the correct variant.
add_header Vary "Accept" always;

# Diagnostic header: reveals which variant was selected (html or md).
# Remove in production if you prefer not to expose this.
add_header X-Sqrd-Cache "$sqrd_cache_ext" always;


# ── Pre-compressed serving ────────────────────────────────────────────────────
# nginx looks for index.html.gz / index.md.gz alongside the plain file and
# serves it automatically to clients that send Accept-Encoding: gzip.
# The plugin writes these siblings when "Pre-compress" is enabled in settings.
gzip_static on;
gzip_vary   on;

# Brotli pre-compressed serving — same idea for .br siblings.
# REQUIRES the ngx_brotli module (https://github.com/google/ngx_brotli) to be
# compiled into nginx. Verify with:  nginx -V 2>&1 | grep brotli
# If the module is missing, nginx will REFUSE TO START with these directives.
# The plugin writes .br siblings when both "Pre-compress" is enabled AND the
# PHP brotli extension (kjdev/php-ext-brotli) is loaded.
# Note: there is no brotli_vary — gzip_vary above also covers Accept-Encoding.
brotli_static on;
brotli_types  text/html text/markdown text/plain text/css text/xml
              application/javascript application/json application/xml+rss;


# ── Block direct access to cache files ───────────────────────────────────────
# The cache directory and .headers sidecar files must never be reachable via
# a direct HTTP request — only via nginx-internal try_files resolution.
location ^~ /wp-content/cache/sqrd-page-cache/ {
    internal;

    # MIME map is scoped HERE — not at server level — so cached .md files get
    # `text/markdown` while wp-admin, theme, and plugin assets continue to be
    # resolved by the inherited mime.types. `default_type` covers the .html.gz
    # / .md.gz / .br siblings that nginx serves transparently for compressed
    # variants (the inner extension is what nginx looks at, but having a sane
    # default keeps any future sidecar from leaking as octet-stream).
    types {
        text/html     html htm shtml;
        text/markdown md;
    }
    default_type text/html;

    # Marker so it's obvious in DevTools / curl when a response came from the
    # sqrd disk cache vs PHP. Set only on the HIT path; PHP MISSes won't carry it.
    add_header X-Cached-By "sqrd-page-cache" always;
}
location ~* "\.headers$" {
    return 404;
}
