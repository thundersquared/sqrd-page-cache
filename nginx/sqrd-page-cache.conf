# ------------------------------------------------------------
# sqrd-page-cache — vhost-scoped nginx include
#
# Place this inside your WordPress server { } block, ABOVE the
# `location /` block. No http { } level changes are required.
#
# After including this file, update your location / block to:
#
#   location / {
#       try_files $sqrd_cache_file $uri $uri/ /index.php?$args;
#   }
#
# See nginx/example-server.conf for a full annotated example.
# ------------------------------------------------------------


# ── MIME types ────────────────────────────────────────────────────────────────
# NOTE: a `types { ... }` block at server scope would REPLACE the inherited
# http-level mime.types entirely — every css/js/woff/png/etc. would then fall
# back to `application/octet-stream`, which modern browsers refuse to execute
# under strict MIME-type checking (wp-admin breaks first, but every theme and
# plugin asset follows). The MIME map for .md is scoped to the cache HIT
# location at the bottom of this file instead, so the rest of the vhost keeps
# using the system mime.types unmodified.


# ── Accept header → cache variant ────────────────────────────────────────────
# Simple substring match — no q-value parsing.
# MUST mirror sqrd\Cache\Negotiation::ext_for_accept() in PHP exactly.
# If you change one, change both.
set $sqrd_cache_ext "html";
if ($http_accept ~* "text/markdown") {
    set $sqrd_cache_ext "md";
}


# ── Next-gen image Accept → extension ─────────────────────────────────────────
# Negotiate AVIF/WebP variants of uploaded JPEG/PNG images based on the client
# Accept header. AVIF is preferred over WebP when both are accepted (better
# compression). $sqrd_img_ext is empty when the client supports neither, in
# which case the try_files in the uploads location at the bottom of this file
# collapses onto the original file with zero wasted stat() calls.
#
# MUST mirror sqrd\Cache\Negotiation::image_ext_for_accept() in PHP exactly.
# If you change one, change both. Generation of the variants is delegated to a
# third-party conversion plugin (e.g. CompressX, or WebP Express + AVIF Express
# in combination); this include only SERVES them. Disable the conversion
# plugin's own delivery/rewrite feature and let nginx do the serving.
set $sqrd_img_ext "";
if ($http_accept ~* "image/webp") {
    set $sqrd_img_ext ".webp";
}
if ($http_accept ~* "image/avif") {
    set $sqrd_img_ext ".avif";
}


# ── URI normalisation ─────────────────────────────────────────────────────────
# Force a trailing slash so /about and /about/ resolve to the same cache file.
# PHP's Paths::normalize_uri() applies the identical rule.
set $sqrd_uri $uri;
if ($sqrd_uri !~ "/$") {
    set $sqrd_uri "${uri}/";
}


# ── Cache file path ───────────────────────────────────────────────────────────
# Build the candidate path for try_files.  When any bypass condition below
# matches, $sqrd_cache_file is redirected to a sentinel path that doesn't
# exist on disk — try_files then falls through harmlessly to PHP.
set $sqrd_cache_file "/wp-content/cache/sqrd-page-cache/$host${sqrd_uri}index.$sqrd_cache_ext";


# ── Bypass conditions ─────────────────────────────────────────────────────────
# Non-GET / non-HEAD methods must never hit the static cache.
if ($request_method !~ ^(GET|HEAD)$) {
    set $sqrd_cache_file "/sqrd-bypass";
}

# Any query string bypasses the cache — EXCEPT when every parameter is a known
# analytics/ad-click tracker (Google Analytics, UTM, Facebook, Microsoft, etc.).
# Tracker-only URLs still resolve to the same cache file because Paths::file_for
# in PHP strips query strings entirely from the cache key.
#
# Pattern list mirrors Output::TRACKING_PATTERNS in PHP — keep both in sync.
# To extend in PHP only, hook the `sqrd_page_cache/tracking_params` filter. To extend
# here, add the new param name to both alternation groups below (it has to appear
# in both: the standalone case and the "joined by &" case).
set $sqrd_has_real_args 0;
if ($args) {
    set $sqrd_has_real_args 1;
}
if ($args ~ "^(_ga|_ga_[A-Z0-9]+|_gl|utm_[a-z_]+|fbclid|gclid|msclkid|mc_cid|mc_eid|yclid|dclid)=[^&]*(&(_ga|_ga_[A-Z0-9]+|_gl|utm_[a-z_]+|fbclid|gclid|msclkid|mc_cid|mc_eid|yclid|dclid)=[^&]*)*$") {
    set $sqrd_has_real_args 0;
}
if ($sqrd_has_real_args) {
    set $sqrd_cache_file "/sqrd-bypass";
}

# Logged-in users, commenters, password-protected posts, and active
# WooCommerce/EDD shopping sessions bypass the cache.
#
# MUST mirror Output::BYPASS_COOKIES in PHP — keep both in lockstep.
# PHP applies the same list on cache MISSes; nginx must enforce it on cache
# HITs, otherwise a shopper with a cart cookie will be served the anonymous
# cached page that PHP would never have written for them.
# To extend in PHP only, hook the `sqrd_page_cache/bypass_cookie_prefixes`
# filter. To extend here, add the new cookie prefix to the alternation below.
if ($http_cookie ~* "(wordpress_logged_in_|wp-postpass_|comment_author_|woocommerce_items_in_cart|woocommerce_cart_hash|wp_woocommerce_session_|edd_items_in_cart|edd_cart_messages)") {
    set $sqrd_cache_file "/sqrd-bypass";
}


# ── Response headers ──────────────────────────────────────────────────────────
# Vary: Accept must appear on every response — both cache HITs served by nginx
# and cache MISSes served by PHP — so downstream caches (CDNs, browser) store
# and replay the correct variant.
add_header Vary "Accept" always;

# Diagnostic header: reveals which variant was selected (html or md).
# Remove in production if you prefer not to expose this.
add_header X-Sqrd-Cache "$sqrd_cache_ext" always;


# ── Pre-compressed serving ────────────────────────────────────────────────────
# nginx serves pre-compressed siblings transparently, in priority order:
#
#   brotli (.br)  →  gzip (.gz)  →  plain file
#
# A client that accepts both br and gzip gets the .br sibling (smaller); a
# gzip-only client gets .gz; a client that accepts neither gets the plain file.
# The plugin writes these siblings for every cached HTML and Markdown response
# when "Pre-compress" is enabled, skipping any sibling that would be larger
# than the original (nginx would otherwise serve the bigger file).
#
# gzip_static is part of stock nginx (ngx_http_gzip_static_module, built by
# default) and is safe to enable unconditionally here.
gzip_static on;
gzip_vary   on;

# Brotli pre-compressed serving is OPT-IN — see nginx/brotli-static.conf.
# ngx_brotli (https://github.com/google/ngx_brotli) is NOT part of stock nginx;
# emitting brotli_static here would make nginx REFUSE TO START on any build
# without the module. Instead, include the optional file ONLY when ngx_brotli
# is compiled in (verify:  nginx -V 2>&1 | grep brotli):
#
#   include /path/to/.../sqrd-page-cache/nginx/brotli-static.conf;
#
# The plugin writes .br siblings when both "Pre-compress" is enabled AND the
# PHP brotli extension (kjdev/php-ext-brotli) is loaded.


# ── Block direct access to cache files ───────────────────────────────────────
# The cache directory and .headers sidecar files must never be reachable via
# a direct HTTP request — only via nginx-internal try_files resolution.
location ^~ /wp-content/cache/sqrd-page-cache/ {
    internal;

    # MIME map is scoped HERE — not at server level — so cached .md files get
    # `text/markdown` while wp-admin, theme, and plugin assets continue to be
    # resolved by the inherited mime.types. `default_type` covers the .html.gz
    # / .md.gz / .br siblings that nginx serves transparently for compressed
    # variants (the inner extension is what nginx looks at, but having a sane
    # default keeps any future sidecar from leaking as octet-stream).
    types {
        text/html     html htm shtml;
        text/markdown md;
    }
    default_type text/html;

    # Marker so it's obvious in DevTools / curl when a response came from the
    # sqrd disk cache vs PHP. Set only on the HIT path; PHP MISSes won't carry it.
    add_header X-Cached-By "sqrd-page-cache" always;
}
location ~* "\.headers$" {
    return 404;
}


# ── Next-gen image serving (AVIF/WebP) ────────────────────────────────────────
# Serves AVIF/WebP variants of uploaded JPEG/PNG images when the client's
# Accept header requests them (see $sqrd_img_ext above) and a variant exists on
# disk. try_files walks the supported sibling-file conventions in order:
#
#   1. $uri$sqrd_img_ext        — appended, same dir   (CompressX, WebP Express
#                                  in "Mingled" mode, AVIF Express, ShortPixel,
#                                  Imagify, EWWW)
#   2. /uploads/$base$ext       — replaced extension, same dir
#   3. /uploads-webpc/...$ext   — separate dir         (Converter for Media)
#   4. $uri                     — original fallback (also when $sqrd_img_ext is
#                                  empty — legacy browsers)
#
# The types{} map is scoped HERE — not at server level — so this location gets
# correct image/avif & image/webp MIMEs even on nginx builds whose system
# mime.types lacks them, while the rest of the vhost keeps using mime.types
# unmodified (same scoping pattern as the markdown cache location above).
#
# Defining add_header in this location means the server-scope add_header
# directives (Vary / X-Sqrd-Cache) do NOT inherit here — by design: image
# responses should not carry the page-cache variant diagnostic, and we re-add
# Vary: Accept explicitly below.
#
# Regex location wins over a generic `location ~* \.(png|jpg)$` static-asset
# block because this file is included ABOVE the user's location / and asset
# blocks, and nginx evaluates regex locations in config order.
location ~* ^/wp-content/uploads/(?<sqrd_img_base>.+)\.(?<sqrd_img_orig>jpe?g|png)$ {
    try_files
        $uri$sqrd_img_ext
        /wp-content/uploads/$sqrd_img_base$sqrd_img_ext
        /wp-content/uploads-webpc/$sqrd_img_base.$sqrd_img_orig$sqrd_img_ext
        $uri =404;

    types {
        image/avif  avif;
        image/webp  webp;
        image/jpeg  jpg jpeg;
        image/png   png;
    }
    default_type image/jpeg;

    # Vary: Accept so CDNs and browsers cache the right per-client variant.
    add_header Vary Accept always;
    # Long immutable cache for image assets.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    expires 1y;
    access_log off;
}
